name: Godot smoke test

on:
  workflow_dispatch:

jobs:
  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2-stable"
    steps:
      - uses: actions/checkout@v4
      - name: Pasang Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Parse skrip dan jalankan smoke test dunia 3D
        run: |
          set +e
          godot --headless --path legacy-godot -s "$GITHUB_WORKSPACE/tests/godot/run_tests.gd" 2>&1 | tee godot.log
          code=${PIPESTATUS[0]}
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot.log; then echo "Ditemukan error skrip Godot"; exit 1; fi
          exit $code
