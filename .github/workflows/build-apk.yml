# Build debug APK otomatis tiap push ke branch main (atau manual lewat tab Actions > Run workflow).
# API key Finnhub diambil dari GitHub Secrets bernama FINNHUB_API_KEY (lihat PANDUAN-GITHUB-BUILD.md).
# APK debug otomatis ditandatangani debug key -> langsung bisa di-install di HP.

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cek secret Finnhub
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "::warning::Secret FINNHUB_API_KEY belum diset. App tetap jalan, tapi harga saham/ETF live tidak akan aktif (crypto tetap jalan)."
          else
            echo "FINNHUB_API_KEY terdeteksi (panjang ${#FINNHUB_API_KEY} karakter)."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xnva-investment-debug-apk
          path: app/build/outputs/apk/debug/*.apk
