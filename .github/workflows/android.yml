name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend tests
        run: npm test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Production static scan
        run: python3 scripts/production-scan.py
      - name: Kotlin static check (heuristic)
        run: python3 scripts/kotlin-static-check.py
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Lint
        run: gradle :app:lintDebug
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: smarteyex-debug-apk
          path: app/build/outputs/apk/debug/*.apk
