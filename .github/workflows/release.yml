name: Release AAB (Play Store)

# Manual: builds a signed .aab for upload to Google Play Console.
# Needs GitHub Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, XNAI_BASE_URL
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          XNAI_BASE_URL: ${{ secrets.XNAI_BASE_URL }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 belum diisi"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD belum diisi"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS belum diisi"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD belum diisi"; exit 1; }
          case "$XNAI_BASE_URL" in https://*) ;; *) echo "XNAI_BASE_URL harus HTTPS"; exit 1 ;; esac
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Release lint
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          XNAI_BASE_URL: ${{ secrets.XNAI_BASE_URL }}
        run: gradle :app:lintRelease
      - name: Production static scan
        run: python3 scripts/production-scan.py
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build signed AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          XNAI_BASE_URL: ${{ secrets.XNAI_BASE_URL }}
        run: gradle :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: smarteyex-release-aab
          path: app/build/outputs/bundle/release/*.aab
